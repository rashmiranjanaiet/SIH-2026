services:
  - type: web
    name: sih-2026-aryan-portal
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_NAME
        value: SIH Portal Administrator
      - key: ADMIN_EMAIL
        value: admin@aryan.edu.in
      - key: ADMIN_PASSWORD
        sync: false
